name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Installs the pnpm version named in package.json's packageManager field.
      # Must run before setup-node, whose pnpm cache needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on a high or critical advisory in production dependencies so
      # they do not drift again. Dev-only packages are not audited.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Validate server.json against MCP Registry schema
        run: pnpm run validate:registry

      - name: Check version sync between package.json and server.json
        run: pnpm run check:versions

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Installs the pnpm version named in package.json's packageManager field.
      # Must run before setup-node, whose pnpm cache needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # Runs on the oldest supported line (engines.node is >=22). The
      # conformance CLI (0.2.0-alpha.12) imports fs.globSync, which Node added
      # in 22, so the floor cannot drop below this without breaking the job.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Boots dist/index.js on a free port with auth disabled and runs the
      # fixture-free scenarios under both the legacy (2025-11-25) and the
      # 2026-07-28 spec versions. Verdicts are per check (see
      # scripts/conformance.mjs), so a "Not testable" probe never fails the job.
      - name: Run MCP conformance suite
        run: pnpm run conformance
