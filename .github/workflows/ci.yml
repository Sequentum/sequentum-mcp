name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version named in package.json's packageManager field.
      # Must run before setup-node, whose pnpm cache needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Validate server.json against MCP Registry schema
        run: pnpm run validate:registry

      - name: Check version sync between package.json and server.json
        run: pnpm run check:versions

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version named in package.json's packageManager field.
      # Must run before setup-node, whose pnpm cache needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Runs on the oldest supported line (engines.node is >=22). The
      # conformance CLI (0.2.0-alpha.12) imports fs.globSync, which Node added
      # in 22, so the floor cannot drop below this without breaking the job.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Boots dist/index.js on a free port with auth disabled and runs the
      # fixture-free scenarios under both the legacy (2025-11-25) and the
      # 2026-07-28 spec versions. Verdicts are per check (see
      # scripts/conformance.mjs), so a "Not testable" probe never fails the job.
      - name: Run MCP conformance suite
        run: pnpm run conformance
