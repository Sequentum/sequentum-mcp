name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate server.json against MCP Registry schema
        run: npm run validate:registry

      - name: Check version sync between package.json and server.json
        run: npm run check:versions

  conformance:
    name: MCP conformance
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Boots dist/index.js on a free port with auth disabled and runs the
      # fixture-free scenarios under both the legacy (2025-11-25) and the
      # 2026-07-28 spec versions. Verdicts are per check (see
      # scripts/conformance.mjs), so a "Not testable" probe never fails the job.
      - name: Run MCP conformance suite
        run: npm run conformance

  pack:
    name: Validate package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack and verify
        run: |
          npm pack --dry-run
          echo "Package contents validated successfully"
