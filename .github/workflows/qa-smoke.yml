name: QA Deployment Smoke

# Deliberately NOT triggered by pull_request or push: this checks DEPLOYED code,
# which a pull request cannot influence. A PR must never go red because QA is
# down. Requires no secrets — every assertion is satisfiable without a token.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to check'
        required: false
        default: 'https://mcp-qa.sequentum.com'

jobs:
  smoke:
    name: Assert deployed QA surface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Installs the pnpm version named in package.json's packageManager field.
      # Must run before setup-node, whose pnpm cache needs pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke script imports the built assertion module from dist/.
      - name: Build
        run: pnpm run build

      - name: Check deployed surface
        run: pnpm run smoke:deployment "${{ inputs.base_url || 'https://mcp-qa.sequentum.com' }}"
